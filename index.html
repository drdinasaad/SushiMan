<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./public/sushi.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sushiman</title>
    <link rel="stylesheet" href="./src/assets/css/style.css">
  </head>
  <body>
    <header>
      <nav class="header__nav">
        <div class="header__logo">
          <h4>SushiMan</h4>
          <div class="header__logo-overlay"></div>
        </div>

        <ul class="header__menu">
            <li>
              <a href="#menu">Menu</a>
            </li>
            <li>
              <a href="#food">food</a>
            </li>
            <li>
              <a href="#services">services</a>
            </li>
            <li>
              <a href="#about-us">about-us</a>
            </li>

            <li>
              <img src="./public/assets/search.svg" alt="search">
            </li>
        </ul>

              <ul class="header__menu-mobile" data-aos="fade-down">
                <li>
                  <img src="./public/assets/menu.svg" alt="menu" />
                </li>
              </ul>

      </nav>
    </header>
     
    <!-- start hero section -->
    <section class="hero">
      <div class="hero-image">
        <img src="./public/assets/sushi-1.png" alt="sushi1" data-aos="fade-up">
       
        <h2 data-aos="fade-up">
          日 <br />
          本 <br />
          食
        </h2>

        <div class="hero-image__overlay"></div>
      </div>

      <div class="hero-content">
        <div class="hero-content-info" data-aos="fade-left">
          <h1>Feel the taste of Japanese food</h1>
          <p>Feel the taste of the most popular Japanese food from anywhere and anytime.</p>

          <div class="hero-content__buttons">
            <button class="hero-content__order-button">order now</button>
            <button class="hero-content__play-button"> <img src="./public/assets/play-circle.svg" alt="play">
              How to Order
            </button>
          </div>
        </div>

        <div class="hero-content__testimonial" data-aos="fade-up">
          <div class="hero-content__customer flex-center">
            <h4>24<span>k+</span></h4>
            <p>Happy Customers</p>
          </div>
        
        
        <div class="hero-content__review">
          <img src="./public/assets/user.png" alt="user" />
          <p>
            “This is the best Japanese food delivery service that ever existed.”
          </p>
        </div>
        </div>

      </div>
    </section>
    <!-- end hero section -->

    <!-- start about us section -->


     <!-- end about us section -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
